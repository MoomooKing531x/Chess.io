services:
  - type: web
    name: moomoochess-battlegrid
    env: node
    plan: free
    buildCommand: ""
    startCommand: "node chessio.js battlegrid"
    envVars:
      - key: PORT
        value: 3000
      - key: RENDER_SERVICE_NAME
        value: moomoochess-battlegrid

  - type: web
    name: moomoochess-kings
    env: node
    plan: free
    buildCommand: ""
    startCommand: "node chessio.js kings"
    envVars:
      - key: PORT
        value: 3001
      - key: RENDER_SERVICE_NAME
        value: moomoochess-kings

  - type: web
    name: moomoochess-pieces
    env: node
    plan: free
    buildCommand: ""
    startCommand: "node chessio.js pieces"
    envVars:
      - key: PORT
        value: 3002
      - key: RENDER_SERVICE_NAME
        value: moomoochess-pieces
